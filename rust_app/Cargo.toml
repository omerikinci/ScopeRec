[package]
name = "scoperec-rust"
version = "0.1.0"
edition = "2024"
description = "Independent native Rust oscilloscope recorder and serial workstation"
default-run = "scoperec-rust"

[lib]
name = "scoperec"

[[bin]]
name = "scoperec-rust"
path = "src/main.rs"

[[bin]]
name = "scoperec-rust-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "scoperec-simulator"
path = "src/bin/simulator.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
csv = "1.3"
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = "=0.34.1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf"] }
regex = "1"
rfd = "0.15"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
